[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Arc testnet is EVM-compatible; pin to paris to avoid PUSH0/transient-storage opcodes
# that some L2s/alt-chains don't support yet.
evm_version = "paris"
# read access to the vendored audited Gnosis artifacts (built separately: cd vendor && forge build)
fs_permissions = [{ access = "read", path = "./vendor" }]

[rpc_endpoints]
base-sepolia = "https://sepolia.base.org"
# 0G Galileo testnet (chain id 16602) — hosts JustifyAttestations, the anchor for
# TEE-verified AI resolutions.
zg-galileo = "https://evmrpc-testnet.0g.ai"

[fmt]
line_length = 110
